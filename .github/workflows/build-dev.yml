name: docker-dev

on:
  push:
    branches:
      - dev

env:
  HARBOR_URL: ${{ secrets.HARBOR_URL }}
  IMAGE_NAME: genai-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch main
        run: git fetch origin main

      - name: Read official version
        id: version
        run: |
          VERSION=$(git show origin/main:.release-please-manifest.json | jq -r '."."')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.HARBOR_URL }}/ai4os/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}-dev
            ${{ env.HARBOR_URL }}/ai4os/${{ env.IMAGE_NAME }}:dev-latest
          build-args: |
            VITE_OIDC_AUTHORITY=https://login.cloud.ai4eosc.eu/realms/ai4eosc
            VITE_OIDC_CLIENT_ID=genai-ui
            VITE_API_URL=https://genai-api.dev.ai4eosc.eu

      - name: Deploy UI DEV
        env:
          WEBHOOK_URL: https://webhooks.cloud.ai4eosc.eu/hooks/deploy-ui-dev
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          TAG: v${{ steps.version.outputs.version }}-dev
        run: |
          PAYLOAD=$(jq -cn --arg tag "$TAG" '{tag: $tag}')
          HASH=$(printf '%s' "$PAYLOAD" \
            | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" \
            | awk '{print $NF}')

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 \
            -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$HASH" \
            -d "$PAYLOAD"
