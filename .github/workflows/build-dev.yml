name: docker-dev

on:
  push:
    branches:
      - develop

env:
  HARBOR_URL: ${{ secrets.HARBOR_URL }}
  IMAGE_NAME: genai-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read current version
        id: version
        run: echo "version=$(jq -r '."."' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.HARBOR_URL }}/ai4os/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}-dev
            ${{ env.HARBOR_URL }}/ai4os/${{ env.IMAGE_NAME }}:dev-latest