
name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          fetch-depth: 0

      - name: Tag major and minor versions
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -d v${{ steps.release.outputs.major }} || true
          git tag -d v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} || true
          git push origin :v${{ steps.release.outputs.major }} || true
          git push origin :v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} || true
          git tag -a v${{ steps.release.outputs.major }} -m "Release v${{ steps.release.outputs.major }}"
          git tag -a v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} -m "Release v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}"
          git push origin v${{ steps.release.outputs.major }}
          git push origin v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}

  build-prod:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.HARBOR_URL }}/ai4os/genai-ui:${{ needs.release-please.outputs.tag_name }}-prod
            ${{ secrets.HARBOR_URL }}/ai4os/genai-ui:latest
          build-args: |
            VITE_OIDC_AUTHORITY=https://login.cloud.ai4eosc.eu/realms/ai4eosc
            VITE_OIDC_CLIENT_ID=genai-ui
            VITE_API_URL=https://genai-api.cloud.ai4eosc.eu

      - name: Deploy UI PROD
        env:
          WEBHOOK_URL: https://webhooks.cloud.ai4eosc.eu/hooks/deploy-ui-prod
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          TAG: ${{ needs.release-please.outputs.tag_name }}-prod
        run: |
          PAYLOAD=$(jq -cn --arg tag "$TAG" '{tag: $tag}')
          HASH=$(printf '%s' "$PAYLOAD" \
            | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" \
            | awk '{print $NF}')

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 \
            -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$HASH" \
            -d "$PAYLOAD"
